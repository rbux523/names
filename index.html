<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Name Draw</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body data-page="draw">
  <main class="draw-screen">
    <header class="draw-topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><h1><span class="rainbow-text">Name Draw</span></h1></div>
      <a class="group-nav" href="group.html" aria-label="Edit group"><span aria-hidden="true">☷</span> Edit group <span class="nav-count" id="draw-group-count">0</span></a>
    </header>

    <section class="draw-stage" aria-labelledby="draw-title">
      <div class="draw-panel">
        <h2 class="panel-label" id="draw-title">Who's next?</h2>
        <div class="reel" id="reel" aria-live="polite" aria-label="Name draw animation">
          <div class="reel-placeholder" id="reel-placeholder">Tap Draw a name to begin</div>
          <div class="reel-track" id="reel-track" hidden></div>
        </div>
        <p class="result" id="draw-status" aria-live="polite">Loading players…</p>
        <button class="draw-button" id="draw-button" type="button" disabled><span class="button-icon" aria-hidden="true">✦</span><span id="draw-button-label">Draw a name</span></button>
        <div class="load-error" id="load-error" role="alert" hidden></div>
      </div>
    </section>

    <section class="history-panel" aria-labelledby="history-title">
      <div class="history-heading"><h2 id="history-title">Draw history</h2><span class="history-count" id="history-count">0 picked</span></div>
      <div class="history-list" id="history-list"><span class="history-empty">Names you draw will appear here</span></div>
    </section>
  </main>
</body>
</html>
