<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>Name Picker</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body data-page="draw">
  <main class="draw-screen">
    <div class="ambient-sky" aria-hidden="true"></div>
    <header class="draw-topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><h1><span class="rainbow-text">Name Picker</span></h1></div>
      <div class="top-actions">
        <button class="draw-reset-button" id="draw-reset-button" type="button" disabled>↻ Reset</button>
        <a class="group-nav" href="group.html" aria-label="Edit group"><span aria-hidden="true">☷</span> Edit group <span class="nav-count" id="draw-group-count">0</span></a>
      </div>
    </header>

    <section class="draw-stage" aria-labelledby="draw-title">
      <h2 class="sr-only" id="draw-title">Who's next?</h2>
      <div class="reel" id="reel" aria-live="polite" aria-label="Name picker animation">
        <div class="reel-placeholder" id="reel-placeholder">Tap Pick a name to begin</div>
        <div class="reel-track" id="reel-track" hidden></div>
        <div class="selection-window" aria-hidden="true"></div>
      </div>
    </section>

    <footer class="draw-bottom">
      <section class="history-panel" aria-labelledby="history-title">
        <div class="history-heading"><h2 id="history-title">Picked names</h2><span class="history-count" id="history-count">0 picked</span></div>
        <div class="history-list" id="history-list"><span class="history-empty">Names you pick will appear here</span></div>
      </section>
      <div class="draw-controls">
        <button class="draw-button" id="draw-button" type="button" disabled><span class="button-icon" aria-hidden="true">✦</span><span id="draw-button-label">Pick a name</span></button>
        <div class="load-error" id="load-error" role="alert" hidden></div>
      </div>
    </footer>
  </main>
</body>
</html>
